<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>姐姐生日快乐</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0a1a0f;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Ma Shan Zheng', 'STKaiti', 'KaiTi', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .bg-layer {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 60% 40% at 20% 30%, rgba(34,120,40,0.18) 0%, transparent 70%),
                radial-gradient(ellipse 50% 50% at 80% 70%, rgba(80,180,70,0.12) 0%, transparent 70%),
                radial-gradient(ellipse 80% 60% at 50% 100%, rgba(20,80,20,0.3) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        .firefly {
            position: fixed;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #b8ff7a;
            box-shadow: 0 0 8px 3px rgba(184,255,122,0.8);
            pointer-events: none;
            animation: fireflyFloat linear infinite;
            z-index: 1;
        }

        @keyframes fireflyFloat {
            0%   { transform: translate(0,0); opacity: 0; }
            10%  { opacity: 1; }
            50%  { opacity: 0.3; }
            70%  { opacity: 1; }
            90%  { opacity: 0.2; }
            100% { transform: translate(var(--dx), var(--dy)); opacity: 0; }
        }

        .leaf {
            position: fixed;
            top: -60px;
            font-size: 18px;
            pointer-events: none;
            animation: leafFall linear forwards;
            z-index: 2;
            filter: drop-shadow(0 0 4px rgba(100,220,80,0.4));
        }

        @keyframes leafFall {
            0%   { transform: translateY(0) rotate(0deg) translateX(0); opacity: 0.9; }
            25%  { transform: translateY(25vh) rotate(45deg) translateX(30px); }
            50%  { transform: translateY(50vh) rotate(90deg) translateX(-20px); }
            75%  { transform: translateY(75vh) rotate(135deg) translateX(25px); }
            100% { transform: translateY(110vh) rotate(180deg) translateX(0); opacity: 0; }
        }

        .card {
            position: relative;
            z-index: 10;
            background: rgba(10, 35, 15, 0.75);
            border: 1.5px solid rgba(100, 220, 80, 0.3);
            border-radius: 28px;
            padding: 44px 48px 40px;
            max-width: 460px;
            width: 90vw;
            text-align: center;
            box-shadow:
                0 0 40px rgba(80,200,60,0.12),
                0 0 80px rgba(40,120,30,0.1),
                inset 0 0 30px rgba(100,200,70,0.04);
            backdrop-filter: blur(12px);
            animation: cardAppear 1.2s cubic-bezier(0.16,1,0.3,1) forwards;
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 15%; right: 15%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(140,240,90,0.6), rgba(80,220,120,0.8), rgba(140,240,90,0.6), transparent);
            border-radius: 2px;
        }

        .crown-ring {
            position: relative;
            width: 160px;
            height: 160px;
            margin: 0 auto 24px;
        }

        .crown-ring svg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            animation: ringRotate 20s linear infinite;
        }

        @keyframes ringRotate {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }

        .crown-center {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 64px;
            line-height: 1;
            filter: drop-shadow(0 0 12px rgba(100,230,80,0.6));
            animation: centerPulse 3s ease-in-out infinite;
        }

        @keyframes centerPulse {
            0%,100% { transform: translate(-50%,-50%) scale(1); filter: drop-shadow(0 0 12px rgba(100,230,80,0.6)); }
            50%      { transform: translate(-50%,-50%) scale(1.08); filter: drop-shadow(0 0 20px rgba(100,230,80,0.9)); }
        }

        .title-main {
            font-size: 32px;
            background: linear-gradient(135deg, #a8ff78, #78ffd6, #c8ff80);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 4px;
            margin-bottom: 8px;
            animation: titleGlow 2s ease-in-out infinite alternate;
        }

        @keyframes titleGlow {
            from { filter: brightness(1); }
            to   { filter: brightness(1.2) drop-shadow(0 0 6px rgba(120,255,150,0.4)); }
        }

        .title-sub {
            font-size: 15px;
            color: rgba(160,240,130,0.7);
            letter-spacing: 2px;
            margin-bottom: 28px;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 20px 0;
            color: rgba(100,200,80,0.4);
            font-size: 14px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(100,200,80,0.4), transparent);
        }

        .blessings {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 24px;
        }

        .blessing-item {
            background: rgba(40,100,30,0.25);
            border: 1px solid rgba(100,200,70,0.2);
            border-radius: 14px;
            padding: 12px 18px;
            color: #c8f0a0;
            font-size: 15px;
            line-height: 1.7;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
            animation: itemAppear 0.6s ease forwards;
            opacity: 0;
        }

        .blessing-item:nth-child(1) { animation-delay: 0.8s; }
        .blessing-item:nth-child(2) { animation-delay: 1.1s; }
        .blessing-item:nth-child(3) { animation-delay: 1.4s; }
        .blessing-item:nth-child(4) { animation-delay: 1.7s; }

        @keyframes itemAppear {
            from { opacity: 0; transform: translateX(-20px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        .blessing-item::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 3px;
            background: linear-gradient(180deg, #78ff78, #40c060);
            border-radius: 3px 0 0 3px;
        }

        .signature {
            font-size: 13px;
            color: rgba(130,210,100,0.5);
            letter-spacing: 2px;
            margin-top: 10px;
        }

        .taurus-float {
            position: fixed;
            pointer-events: none;
            animation: taurusRise linear forwards;
            z-index: 5;
            font-size: 22px;
            opacity: 0;
            filter: drop-shadow(0 0 6px rgba(120,255,80,0.6));
        }

        @keyframes taurusRise {
            0%   { opacity: 0; transform: translateY(0) scale(0.6) rotate(-10deg); }
            15%  { opacity: 0.9; }
            85%  { opacity: 0.7; }
            100% { opacity: 0; transform: translateY(-120vh) scale(1.1) rotate(15deg); }
        }

        .danmaku-layer {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none;
            overflow: hidden;
            z-index: 200;
        }

        .danmaku {
            position: absolute;
            right: -800px;
            white-space: nowrap;
            font-size: 16px;
            font-weight: 600;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            padding: 5px 16px;
            border-radius: 20px;
            pointer-events: none;
            opacity: 0;
            animation: danmakuFly linear forwards;
        }

        .danmaku-green {
            background: rgba(60,180,60,0.15);
            border: 1px solid rgba(100,220,80,0.4);
            color: #a0f080;
            text-shadow: 0 0 8px rgba(100,220,80,0.5);
        }

        .danmaku-gold {
            background: rgba(200,180,40,0.15);
            border: 1px solid rgba(220,200,60,0.4);
            color: #e8d870;
            text-shadow: 0 0 8px rgba(220,200,60,0.5);
            font-size: 18px;
        }

        @keyframes danmakuFly {
            0%   { right: -800px; opacity: 0; }
            5%   { opacity: 1; }
            90%  { opacity: 1; }
            100% { right: 110vw; opacity: 0; }
        }

        .corner-deco {
            position: fixed;
            font-size: 28px;
            opacity: 0.25;
            pointer-events: none;
            z-index: 1;
            animation: cornerSway 4s ease-in-out infinite alternate;
        }
        .corner-deco.tl { top: 20px; left: 20px; }
        .corner-deco.tr { top: 20px; right: 20px; }
        .corner-deco.bl { bottom: 20px; left: 20px; }
        .corner-deco.br { bottom: 20px; right: 20px; }

        @keyframes cornerSway {
            from { transform: rotate(-5deg); }
            to   { transform: rotate(5deg); }
        }
    </style>
</head>
<body>

    <div class="bg-layer"></div>

    <div class="corner-deco tl">🌿</div>
    <div class="corner-deco tr">🌿</div>
    <div class="corner-deco bl">🍃</div>
    <div class="corner-deco br">🍃</div>

    <div class="danmaku-layer" id="danmakuLayer"></div>

    <div class="card">
        <div class="crown-ring">
            <svg viewBox="0 0 160 160">
                <defs>
                    <path id="cp2" d="M 80,80 m -62,0 a 62,62 0 1,1 124,0 a 62,62 0 1,1 -124,0"/>
                    <linearGradient id="gGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%"   stop-color="#78ff78"/>
                        <stop offset="50%"  stop-color="#c8ff80"/>
                        <stop offset="100%" stop-color="#78ffd6"/>
                    </linearGradient>
                </defs>
                <text font-size="13" font-family="'Ma Shan Zheng','STKaiti',serif" letter-spacing="2" fill="url(#gGrad2)">
                    <textPath href="#cp2">🌱 姐姐专属 🌱 姐姐专属 🌱 姐姐专属 🌱 姐姐专属</textPath>
                </text>
                <circle cx="80" cy="18" r="3" fill="rgba(120,255,120,0.5)"/>
                <circle cx="142" cy="80" r="2.5" fill="rgba(180,255,100,0.4)"/>
                <circle cx="80" cy="142" r="3" fill="rgba(100,255,160,0.5)"/>
                <circle cx="18" cy="80" r="2.5" fill="rgba(120,255,100,0.4)"/>
            </svg>
            <div class="crown-center">🌸</div>
        </div>

        <div class="title-main">姐姐生日快乐</div>
        <div class="title-sub">♉ 金牛座 · 三十而立，依然少女 ♉</div>

        <div class="divider">🍃 · 🌿 · 🍃</div>

        <div class="blessings">
            <div class="blessing-item">🌸 三十岁，不是变老的开始，是把所有可爱都沉淀成了闪光 &mdash; 姐，你就是那种三十岁还能让人觉得「她好有趣啊」的人。</div>
            <div class="blessing-item">🌿 你身上有一种魔法：走进来就让氛围变好，笑起来就让人跟着开心。这种少女感，岁月偷不走。</div>
            <div class="blessing-item">✨ 金牛座的你，稳稳的，暖暖的，却又藏着一颗跳脱的心。愿你的三十岁，继续开朗，继续有趣，继续发光。</div>
            <div class="blessing-item">🎂 生日快乐，姐姐！愿你今天被所有喜欢的事情包围，被所有喜欢你的人珍惜 💚</div>
        </div>

        <div class="signature">🌱 愿你如森林，深邃而生机勃勃 🌱</div>
    </div>

    <script>
        // 萤火虫
        function createFirefly() {
            var el = document.createElement('div');
            el.className = 'firefly';
            el.style.left = Math.random() * 100 + 'vw';
            el.style.top = Math.random() * 100 + 'vh';
            el.style.setProperty('--dx', ((Math.random() - 0.5) * 200) + 'px');
            el.style.setProperty('--dy', ((Math.random() - 0.5) * 200) + 'px');
            el.style.animationDuration = (4 + Math.random() * 6) + 's';
            el.style.animationDelay = Math.random() * 3 + 's';
            var colors = ['#b8ff7a','#7affd6','#d0ff80','#80ffb0','#a0ffcc'];
            el.style.background = colors[Math.floor(Math.random() * colors.length)];
            document.body.appendChild(el);
            setTimeout(function() { if(el.parentNode) el.parentNode.removeChild(el); }, 12000);
        }
        for(var i = 0; i < 25; i++) setTimeout(createFirefly, i * 300);
        setInterval(createFirefly, 800);

        // 飘落树叶
        var leafEmojis = ['🍃','🍀','🌿','🌱','🍂'];
        function createLeaf() {
            var el = document.createElement('div');
            el.className = 'leaf';
            el.textContent = leafEmojis[Math.floor(Math.random() * leafEmojis.length)];
            el.style.left = Math.random() * 100 + 'vw';
            el.style.fontSize = (14 + Math.random() * 14) + 'px';
            el.style.animationDuration = (6 + Math.random() * 6) + 's';
            document.body.appendChild(el);
            setTimeout(function() { if(el.parentNode) el.parentNode.removeChild(el); }, 13000);
        }
        for(var i = 0; i < 8; i++) setTimeout(createLeaf, i * 600);
        setInterval(createLeaf, 1200);

        // 金牛座漂浮
        var taurusSymbols = ['♉','🐂','⭐','🌟','💚','🌿'];
        function createTaurus() {
            var el = document.createElement('div');
            el.className = 'taurus-float';
            el.textContent = taurusSymbols[Math.floor(Math.random() * taurusSymbols.length)];
            el.style.left = (5 + Math.random() * 90) + 'vw';
            el.style.bottom = '-60px';
            el.style.fontSize = (16 + Math.random() * 16) + 'px';
            el.style.animationDuration = (7 + Math.random() * 5) + 's';
            document.body.appendChild(el);
            setTimeout(function() { if(el.parentNode) el.parentNode.removeChild(el); }, 13000);
        }
        setInterval(createTaurus, 1800);
        setTimeout(function() {
            for(var i = 0; i < 5; i++) setTimeout(createTaurus, i * 400);
        }, 1000);

        // 弹幕
        var tracks = [{ top: '10vh' }, { top: '20vh' }];
        var normalTexts = [
            '💚 姐姐，你是我见过最有趣的人',
            '🌿 三十岁少女，永不止步',
            '✨ 姐姐生日快乐，闪闪发光！',
            '♉ 金牛座的你，稳稳幸福',
            '🌸 愿你今天被爱包围',
        ];
        var danmakuIdx = 0;
        var toggle = 0;

        function sendDanmaku(text, cls, track) {
            var layer = document.getElementById('danmakuLayer');
            var el = document.createElement('div');
            el.className = 'danmaku ' + cls;
            el.textContent = text;
            el.style.top = track.top;
            el.style.animationDuration = (8 + Math.random() * 2) + 's';
            layer.appendChild(el);
            setTimeout(function() { if(el.parentNode) el.parentNode.removeChild(el); }, 11000);
        }

        setTimeout(function() {
            sendDanmaku('🎂 姐姐！今天是你的生日哦，三十而立，三十而美！', 'danmaku-gold', tracks[0]);
        }, 3000);

        setTimeout(fireNormal, 5500);

        function fireNormal() {
            var track = tracks[toggle % 2];
            toggle++;
            sendDanmaku(normalTexts[danmakuIdx % normalTexts.length], 'danmaku-green', track);
            danmakuIdx++;
            setTimeout(fireNormal, 2400);
        }
    </script>
</body>
</html>
